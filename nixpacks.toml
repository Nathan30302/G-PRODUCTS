# Ensure Tailwind/PostCSS/TypeScript are available during `next build`
# even when the host sets NODE_ENV=production at install time.
[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
# Direct tsx — avoid `npm run` so Railway redeploy SIGTERM is not a fake npm crash.
cmd = "./node_modules/.bin/tsx scripts/start-prod.ts"

[variables]
NPM_CONFIG_PRODUCTION = "false"
NODE_ENV = "production"

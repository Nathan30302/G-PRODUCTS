# Railway / Nixpacks config for G-Products
# https://docs.railway.com/

[build]
builder = "NIXPACKS"
# Install ALL deps (including Tailwind/TypeScript) even when NODE_ENV=production
buildCommand = "npm ci && npm run build"

[deploy]
# Run tsx directly — `npm run` turns Railway redeploy SIGTERM into a fake "npm error".
startCommand = "./node_modules/.bin/tsx scripts/start-prod.ts"
# Give prisma generate / db push / seed time before health checks
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
# Defaults — override in Railway dashboard Variables
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

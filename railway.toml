# Railway / Nixpacks config for G-Products
# https://docs.railway.com/

[build]
builder = "NIXPACKS"
# Install ALL deps (including Tailwind/TypeScript) even when NODE_ENV=production
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm run start:prod"
# Give prisma generate / db push time before traffic health checks
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
# Defaults — override in Railway dashboard Variables
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
